<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Process - KMS</title>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Sarabun',sans-serif;
      background:#F4F7FB;
      color:#2E3A59;
      min-height:100vh;
      overflow-x:hidden;
    }

    .container{display:flex;min-height:100vh}

    .sidebar{
      width:70px;
      background:linear-gradient(180deg,#4A89C8 0%,#2E75B6 100%);
      position:fixed;
      left:0;
      top:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:20px;
      gap:10px;
      z-index:100;
    }

    .sidebar-icon{
      width:50px;
      height:50px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.9);
      text-decoration:none;
      font-size:20px;
      transition:.2s;
    }

    .sidebar-icon:hover,
    .sidebar-icon.active{
      background:rgba(255,255,255,.16);
      color:#fff;
    }

    .main-content{
      flex:1;
      margin-left:70px;
      width:calc(100% - 70px);
    }

    .wrap{padding:16px}

    .topbar{
      background:#fff;
      border-radius:18px;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      box-shadow:0 4px 16px rgba(46,58,89,.06);
      margin-bottom:14px;
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .pill{
      display:flex;
      align-items:center;
      gap:8px;
      background:#EAF3FF;
      color:#2F80ED;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
    }

    .meta{
      font-size:13px;
      color:#6B7A90;
      font-weight:700;
    }

    .btn-back{
      background:#2F80ED;
      color:#fff;
      text-decoration:none;
      padding:12px 18px;
      border-radius:14px;
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      transition:.2s;
    }

    .btn-back:hover{transform:translateY(-1px)}

    .stage{
      display:grid;
      grid-template-columns:1fr 420px;
      gap:16px;
      align-items:start;
    }

    @media(max-width:1200px){
      .stage{grid-template-columns:1fr}
    }

    .slide{
      background:#fff;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(46,58,89,.08);
    }

    .slide-head{
      padding:22px;
      border-bottom:1px solid #EEF3F8;
      display:flex;
      gap:16px;
      align-items:flex-start;
    }

    .badge{
      width:58px;
      height:58px;
      border-radius:18px;
      background:#2F80ED;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
      font-weight:900;
      flex:0 0 auto;
    }

    .head-text{flex:1}

    .title{
      font-size:34px;
      line-height:1.15;
      font-weight:900;
      color:#1F2D3D;
    }

    .short{
      margin-top:8px;
      font-size:18px;
      color:#6B7A90;
      font-weight:600;
    }

    .slide-body{
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .process-flow-section{
      background:#F8FBFF;
      border:1px solid #E5EDF5;
      border-radius:22px;
      padding:20px;
    }

    .side-section-title{
      display:flex;
      align-items:center;
      gap:10px;
      color:#234A74;
      font-weight:900;
      font-size:18px;
    }

    .flow-top-wrap{
      margin-top:18px;
      display:flex;
      align-items:center;
      gap:10px;
      overflow-x:auto;
      padding-bottom:10px;
    }

    .flow-top-wrap::-webkit-scrollbar{height:8px}
    .flow-top-wrap::-webkit-scrollbar-thumb{
      background:#D6E3F2;
      border-radius:999px;
    }

    .flow-start,
    .flow-end{
      min-width:110px;
      height:62px;
      border-radius:18px;
      border:2px solid #2F80ED;
      background:#fff;
      color:#2F80ED;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:900;
      flex:0 0 auto;
    }

    .flow-arrow-inline{
      color:#7B8BA1;
      font-size:18px;
      flex:0 0 auto;
    }

    .flow-step{
      min-width:220px;
      min-height:120px;
      background:#fff;
      border:2px solid #E5EDF5;
      border-radius:22px;
      padding:18px 16px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      transition:.2s;
      cursor:pointer;
      flex:0 0 auto;
    }

    .flow-step:hover{transform:translateY(-2px)}

    .flow-step-no{
      width:42px;
      height:42px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#EAF3FF;
      color:#2F80ED;
      font-weight:900;
      font-size:16px;
      margin-bottom:14px;
    }

    .flow-step-short{
      font-size:18px;
      font-weight:900;
      line-height:1.45;
      color:#1F2D3D;
      text-align:center;
    }

    .flow-step.completed{
      background:#F0FDF4;
      border-color:#22C55E;
    }

    .flow-step.completed .flow-step-no{
      background:#22C55E;
      color:#fff;
    }

    .flow-step.active{
      background:#EFF6FF;
      border-color:#2F80ED;
      box-shadow:0 0 0 5px rgba(47,128,237,.15);
    }

    .flow-step.active .flow-step-no{
      background:#2F80ED;
      color:#fff;
    }

    .detail{
      background:#fff;
      border-radius:18px;
      padding:18px;
      font-size:17px;
      line-height:1.9;
      white-space:pre-line;
    }

    .btn-wi{
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:#2F80ED;
      color:#fff;
      text-decoration:none;
      padding:14px 18px;
      border-radius:16px;
      width:fit-content;
      font-weight:900;
      box-shadow:0 8px 18px rgba(47,128,237,.2);
    }

    .hazard-frame{
      --b:8px;
      --r:22px;
      position:relative;
      border-radius:var(--r);
      padding:var(--b);
      overflow:hidden;
      box-shadow:0 4px 12px rgba(46,58,89,.10);
    }

    .hazard-frame::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:var(--r);
      background:repeating-linear-gradient(
        45deg,
        var(--c1) 0 14px,
        var(--c2) 14px 28px
      );
      z-index:0;
    }

    .hazard-frame::after{
      content:"";
      position:absolute;
      inset:var(--b);
      border-radius:calc(var(--r) - var(--b));
      background:var(--inner);
      z-index:1;
    }

    .hazard-red{
      --c1:#111;
      --c2:#E53935;
      --inner:#FFF1F1;
    }

    .hazard-yellow{
      --c1:#111;
      --c2:#FFD600;
      --inner:#FFFBEA;
    }

    .critical,
    .impact{
      position:relative;
      z-index:2;
      padding:18px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      font-weight:800;
      font-size:14px;
      line-height:1.6;
    }

    .critical{
      color:#C62828;
      white-space:pre-line;
    }

    .impact{color:#8A5A00}

    .impact-text{flex:1;width:100%}

    .impact-table{
      width:100%;
      border-collapse:collapse;
      background:rgba(255,255,255,.65);
      border-radius:12px;
      overflow:hidden;
    }

    .impact-table th,
    .impact-table td{
      border:1px solid rgba(138,90,0,.22);
      padding:10px 12px;
      vertical-align:top;
      text-align:left;
      font-size:14px;
      line-height:1.55;
    }

    .impact-table th{
      width:190px;
      background:rgba(255,214,0,.20);
      color:#7A4F00;
      font-weight:900;
      white-space:nowrap;
    }

    .impact-table td{
      color:#5F4300;
      font-weight:800;
      white-space:pre-line;
    }

    .panel{
      background:#fff;
      border-radius:24px;
      padding:20px;
      box-shadow:0 8px 24px rgba(46,58,89,.08);
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .progress{
      background:#F5F9FF;
      border:1px solid #E2ECF8;
      border-radius:18px;
      padding:16px;
    }

    .progress-top{
      display:flex;
      justify-content:space-between;
      font-weight:900;
      color:#234A74;
    }

    .bar{
      margin-top:12px;
      height:12px;
      border-radius:999px;
      background:#DCE8F6;
      overflow:hidden;
    }

    .bar > div{
      height:100%;
      background:#2F80ED;
      border-radius:999px;
      transition:.25s;
    }

    .nav-btns{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .btn{
      border:none;
      padding:14px;
      border-radius:16px;
      font-family:'Sarabun',sans-serif;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      transition:.2s;
    }

    .btn-prev{
      background:#EEF3F8;
      color:#2E3A59;
    }

    .btn-next{
      background:#2F80ED;
      color:#fff;
    }

    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .mini-list{
      border:1px solid #E9F0F8;
      border-radius:18px;
      overflow:hidden;
    }

    .mini-item{
      padding:14px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      border-bottom:1px solid #EEF3F8;
      cursor:pointer;
      transition:.2s;
    }

    .mini-item:last-child{border-bottom:none}

    .mini-no{
      width:34px;
      height:34px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#EAF3FF;
      color:#2F80ED;
      font-size:13px;
      font-weight:900;
      flex:0 0 auto;
    }

    .mini-t{
      font-size:15px;
      font-weight:900;
      color:#1F2D3D;
      line-height:1.4;
    }

    .mini-s{
      margin-top:4px;
      font-size:13px;
      line-height:1.45;
      color:#6B7A90;
    }

    .mini-item.completed{
      background:#F0FDF4;
      border-left:6px solid #22C55E;
    }

    .mini-item.completed .mini-no{
      background:#22C55E;
      color:#fff;
    }

    .mini-item.active{
      background:#EFF6FF;
      border-left:6px solid #2F80ED;
    }

    .mini-item.active .mini-no{
      background:#2F80ED;
      color:#fff;
    }

  </style>
</head>
