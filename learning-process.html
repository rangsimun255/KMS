<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Process - KMS</title>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Sarabun',sans-serif;
      background:#F4F7FB;
      min-height:100vh;
      overflow-x:hidden;
      color:#2E3A59;
      font-size:14px;
      line-height:1.7;
    }

    .container{
      display:flex;
      min-height:100vh;
    }

    .sidebar{
      width:70px;
      background:linear-gradient(180deg,#4A89C8 0%,#2E75B6 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:20px;
      gap:10px;
      position:fixed;
      height:100vh;
      left:0;
      top:0;
      z-index:100;
    }

    .sidebar-icon{
      width:50px;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.85);
      font-size:20px;
      border-radius:12px;
      cursor:pointer;
      transition:.2s;
      text-decoration:none;
    }

    .sidebar-icon:hover,
    .sidebar-icon.active{
      background:rgba(255,255,255,.18);
      color:#fff;
    }

    .main-content{
      flex:1;
      margin-left:70px;
      width:calc(100% - 70px);
    }

    .header{
      background:linear-gradient(135deg,#4A89C8 0%,#2E75B6 100%);
      padding:60px 40px;
      text-align:center;
      box-shadow:0 4px 15px rgba(74,137,200,.25);
    }

    .header h1{
      color:#fff;
      font-size:42px;
      font-weight:700;
      margin-bottom:15px;
    }

    .header p{
      color:rgba(255,255,255,.95);
      font-size:18px;
    }

    .wrap{
      padding:16px 18px 24px;
    }

    .topbar{
      background:#fff;
      border-radius:16px;
      padding:14px 16px;
      box-shadow:0 2px 10px rgba(46,58,89,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#E6F0FA;
      color:#2E75B6;
      font-weight:800;
      font-size:13px;
    }

    .meta{
      color:#6B7A90;
      font-size:13px;
    }

    .btn-back{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:10px;
      background:#4A89C8;
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }

    .btn-back:hover{
      background:#2E75B6;
    }

    .stage{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:14px;
    }

    @media (max-width:980px){
      .stage{
        grid-template-columns:1fr;
      }
    }

    .slide{
      background:#fff;
      border-radius:18px;
      box-shadow:0 6px 18px rgba(46,58,89,.10);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .slide-head{
      padding:16px;
      border-bottom:1px solid #eef3f8;
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .badge{
      width:44px;
      height:44px;
      border-radius:16px;
      background:#4A89C8;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:16px;
      flex:0 0 auto;
    }

    .head-text{
      flex:1;
    }

    .title{
      font-weight:900;
      color:#1f2d3d;
      font-size:20px;
      line-height:1.15;
    }

    .short{
      margin-top:8px;
      color:#6B7A90;
      font-size:14px;
    }

    .slide-body{
      padding:14px 16px 16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .detail{
      color:#2E3A59;
      font-size:14px;
      line-height:1.55;
      padding:12px;
      white-space:pre-line;
    }

    .wi-actions{
      margin-top:10px;
    }

    .btn-wi{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 14px;
      border-radius:12px;
      background:#2F80ED;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      box-shadow:0 6px 16px rgba(47,128,237,0.22);
    }

    .hazard-frame{
      --b:8px;
      --r:22px;
      position:relative;
      border-radius:var(--r);
      padding:var(--b);
      overflow:hidden;
    }

    .hazard-frame::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:var(--r);
      background:repeating-linear-gradient(
        45deg,
        var(--c1) 0 14px,
        var(--c2) 14px 28px
      );
    }

    .hazard-frame::after{
      content:"";
      position:absolute;
      inset:var(--b);
      border-radius:calc(var(--r) - var(--b));
      background:var(--inner);
    }

    .hazard-red{
      --c1:#111;
      --c2:#D32F2F;
      --inner:#FDECEA;
    }

    .hazard-yellow{
      --c1:#111;
      --c2:#F7D400;
      --inner:#FFF8E1;
    }

    .critical,
    .impact{
      position:relative;
      z-index:2;
      padding:18px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      font-size:14px;
      font-weight:800;
      background:transparent;
    }

    .critical{
      color:#B71C1C;
      white-space:pre-line;
    }

    .impact{
      color:#7A4F00;
    }

    .impact-text{
      flex:1;
    }

    .impact-title{
      font-weight:900;
      margin-bottom:6px;
    }

    .impact-line,
    .impact-list{
      white-space:pre-line;
    }

    .impact-subtitle{
      font-weight:900;
      margin-top:12px;
      margin-bottom:6px;
    }

    .process-flow-section{
      margin-top:14px;
      padding:16px;
      border-radius:18px;
      background:#F8FBFF;
      border:1px solid #E5EDF5;
    }

    .side-section-title{
      font-size:14px;
      font-weight:900;
      color:#294b6a;
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
    }

    .flowchart{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    .flowchart-wide{
      max-width:560px;
      margin:0 auto;
    }

    .flow-terminal{
      width:100%;
      text-align:center;
      padding:10px;
      border-radius:999px;
      background:#EEF6FF;
      border:2px solid #4A89C8;
      color:#2E75B6;
      font-weight:900;
      font-size:12px;
    }

    .flow-arrow{
      color:#7B8BA1;
      font-size:16px;
    }

    .flow-card{
      width:100%;
      border-radius:16px;
      padding:12px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      cursor:pointer;
      transition:.2s;
      border:2px solid #E5EDF5;
      background:#fff;
    }

    .flow-card:hover{
      transform:translateY(-1px);
    }

    .flow-no{
      width:30px;
      height:30px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:12px;
      background:#EAF3FF;
      color:#2E75B6;
      flex:0 0 auto;
    }

    .flow-title{
      font-size:13px;
      font-weight:900;
      color:#1F2D3D;
    }

    .flow-short{
      margin-top:4px;
      font-size:12px;
      color:#6B7A90;
      line-height:1.35;
    }

    .flow-card.completed{
      background:#F0FDF4;
      border-color:#22C55E;
    }

    .flow-card.completed .flow-no{
      background:#22C55E;
      color:#fff;
    }

    .flow-card.active{
      background:#EFF6FF;
      border-color:#2F80ED;
      box-shadow:0 0 0 4px rgba(47,128,237,.12);
    }

    .flow-card.active .flow-no{
      background:#2F80ED;
      color:#fff;
    }

    .panel{
      background:#fff;
      border-radius:18px;
      box-shadow:0 2px 10px rgba(46,58,89,.08);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .progress{
      background:#f2f7fd;
      border:1px solid #e3edf8;
      border-radius:16px;
      padding:12px;
    }

    .progress-top{
      display:flex;
      justify-content:space-between;
      font-weight:800;
      color:#294b6a;
    }

    .bar{
      height:10px;
      border-radius:999px;
      background:#dbe7f6;
      margin-top:10px;
      overflow:hidden;
    }

    .bar > div{
      height:100%;
      background:#4A89C8;
      border-radius:999px;
    }

    .nav-btns{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .btn{
      border:none;
      border-radius:14px;
      padding:12px;
      font-family:'Sarabun',sans-serif;
      font-weight:900;
      cursor:pointer;
    }

    .btn-prev{
      background:#eef3f8;
      color:#2c3e50;
    }

    .btn-next{
      background:#4A89C8;
      color:#fff;
    }

    .mini-list{
      border:1px solid #eef3f8;
      border-radius:16px;
      overflow:hidden;
      background:#fff;
    }

    .mini-item{
      padding:10px 12px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      border-bottom:1px solid #eef3f8;
      cursor:pointer;
      background:#fff;
      transition:.2s;
    }

    .mini-item:last-child{
      border-bottom:none;
    }

    .mini-no{
      width:26px;
      height:26px;
      border-radius:10px;
      background:#E6F0FA;
      color:#2E75B6;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:12px;
      flex:0 0 auto;
    }

    .mini-t{
      font-size:13px;
      font-weight:900;
      color:#1f2d3d;
      line-height:1.25;
    }

    .mini-s{
      font-size:12px;
      color:#6B7A90;
      margin-top:4px;
      line-height:1.3;
    }

    .mini-item.completed{
      background:#F0FDF4;
      border-left:5px solid #22C55E;
    }

    .mini-item.completed .mini-no{
      background:#22C55E;
      color:#fff;
    }

    .mini-item.active{
      background:#EFF6FF;
      border-left:5px solid #2F80ED;
      outline:2px solid #BFDBFE;
      outline-offset:-2px;
    }

    .mini-item.active .mini-no{
      background:#2F80ED;
      color:#fff;
    }

    .loading,.error{
      background:#fff;
      border-radius:16px;
      padding:30px;
      text-align:center;
      color:#6B7A90;
    }
  </style>
</head>

<body>
<div class="container">

<nav class="sidebar">
  <a class="sidebar-icon" href="index.html"><i class="fas fa-home"></i></a>
  <a class="sidebar-icon" href="knowledge-base.html"><i class="fas fa-book"></i></a>
  <a class="sidebar-icon active" href="learning-path.html"><i class="fas fa-graduation-cap"></i></a>
  <a class="sidebar-icon" href="quiz.html"><i class="fas fa-clipboard-check"></i></a>
  <a class="sidebar-icon" href="share-experience.html"><i class="fas fa-comments"></i></a>
</nav>

<main class="main-content">

<header class="header">
  <h1>Learning Process</h1>
  <p>เรียนทีละ Step แบบสไลด์</p>
</header>

<div class="wrap">

<div class="topbar">
  <div style="display:flex; gap:10px; align-items:center;">
    <span class="pill">
      <i class="fas fa-gear"></i>
      <span id="procTitle">Process</span>
    </span>

    <span class="meta" id="procMeta">-</span>
  </div>

  <a class="btn-back" href="learning-path.html">
    <i class="fas fa-arrow-left"></i>
    กลับหน้า Learning Path
  </a>
</div>

<div id="content">
  <div class="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <div>กำลังโหลดข้อมูล...</div>
  </div>
</div>

</div>
</main>
</div>

<script>
const API_BASE = "https://script.google.com/macros/s/AKfycbwMRbnqSLTmmI4wofmNfZ5YPFGSiqg__rZUgyDlTTR03JchnQXgUj7DKDvzS4-QBmJrvw/exec";
const LEARNING_API = API_BASE + "?view=learning";

let steps = [];
let index = 0;

function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function getStepStatus(idx){
  if(idx < index) return "completed";
  if(idx === index) return "active";
  return "pending";
}

function setIndex(i){
  index = Math.max(0, Math.min(i, steps.length - 1));
  render();
}

function render(){

  const s = steps[index];
  const total = steps.length;
  const percent = Math.round(((index+1)/total)*100);

  document.getElementById("content").innerHTML = `
    <div class="stage">

      <div class="slide">

        <div class="slide-head">
          <div class="badge">${esc(s.StepNo)}</div>

          <div class="head-text">
            <div class="title">${esc(s.StepTitle)}</div>
            <div class="short">${esc(s.StepShort || "")}</div>
          </div>
        </div>

        <div class="slide-body">

          <div class="detail">
${esc(s.StepDetail || "")}
          </div>

          <div class="hazard-frame hazard-red">
            <div class="critical">
              <i class="fas fa-triangle-exclamation"></i>

              <div>
Critical Point:
${esc(s.CriticalPoint || "-")}
              </div>
            </div>
          </div>

          <div class="hazard-frame hazard-yellow">
            <div class="impact">
              <i class="fas fa-share-nodes"></i>

              <div class="impact-text">
                <div class="impact-title">
                  ถ้าพลาดจะกระทบกระบวนการ
                </div>

                <div class="impact-line">
${esc(s.ImpactProcess || "-")}
                </div>

                <div class="impact-subtitle">
                  ทำให้เกิดของเสีย
                </div>

                <div class="impact-list">
${esc(s.ImpactDefect || "-")}
                </div>
              </div>
            </div>
          </div>

          <!-- PROCESS FLOW -->
          <div class="process-flow-section">

            <div class="side-section-title">
              <i class="fas fa-diagram-project"></i>
              Process Flow
            </div>

            <div class="flowchart flowchart-wide">

              <div class="flow-terminal">
                START
              </div>

              ${steps.map((x,idx)=>`

                <div class="flow-arrow">
                  <i class="fas fa-arrow-down"></i>
                </div>

                <div class="flow-card ${getStepStatus(idx)}" data-idx="${idx}">

                  <div class="flow-no">
                    ${esc(x.StepNo)}
                  </div>

                  <div>
                    <div class="flow-title">
                      ${esc(x.StepTitle)}
                    </div>

                    <div class="flow-short">
                      ${esc(x.StepShort || "")}
                    </div>
                  </div>

                </div>

              `).join("")}

              <div class="flow-arrow">
                <i class="fas fa-arrow-down"></i>
              </div>

              <div class="flow-terminal">
                END
              </div>

            </div>
          </div>

        </div>
      </div>

      <!-- RIGHT -->
      <aside class="panel">

        <div class="progress">
          <div class="progress-top">
            <div>Step ${index+1} / ${total}</div>
            <div>${percent}%</div>
          </div>

          <div class="bar">
            <div style="width:${percent}%"></div>
          </div>
        </div>

        <div class="nav-btns">
          <button class="btn btn-prev" id="btnPrev">
            ← ก่อนหน้า
          </button>

          <button class="btn btn-next" id="btnNext">
            ถัดไป →
          </button>
        </div>

        <div class="side-section-title">
          <i class="fas fa-list-check"></i>
          Step Overview
        </div>

        <div class="mini-list">

          ${steps.map((x,idx)=>`

            <div class="mini-item ${getStepStatus(idx)}" data-idx="${idx}">

              <div class="mini-no">
                ${esc(x.StepNo)}
              </div>

              <div>
                <div class="mini-t">
                  ${esc(x.StepTitle)}
                </div>

                <div class="mini-s">
                  ${esc(x.StepShort || "")}
                </div>
              </div>

            </div>

          `).join("")}

        </div>

      </aside>

    </div>
  `;

  document.getElementById("btnPrev").onclick = ()=> setIndex(index-1);
  document.getElementById("btnNext").onclick = ()=> setIndex(index+1);

  document.querySelectorAll(".mini-item, .flow-card").forEach(el=>{
    el.addEventListener("click", ()=>{
      const idx = Number(el.dataset.idx);
      if(!Number.isNaN(idx)) setIndex(idx);
    });
  });
}

async function load(){

  const res = await fetch(LEARNING_API);
  const data = await res.json();

  steps = data
    .filter(x => String(x.Process).trim() === "1")
    .sort((a,b)=> Number(a.StepNo)-Number(b.StepNo));

  render();
}

load();
</script>
</body>
</html>
