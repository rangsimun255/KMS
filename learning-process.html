<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Process - KMS</title>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Sarabun',sans-serif;
      background:#F4F7FB;
      min-height:100vh;
      overflow-x:hidden;
      color:#2E3A59;
    }

    .container{
      display:flex;
      min-height:100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar{
      width:70px;
      background:linear-gradient(180deg,#4A89C8 0%,#2E75B6 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:20px;
      gap:10px;
      position:fixed;
      height:100vh;
      left:0;
      top:0;
      z-index:100;
    }

    .sidebar-icon{
      width:50px;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.9);
      font-size:20px;
      border-radius:14px;
      text-decoration:none;
      transition:.2s;
    }

    .sidebar-icon:hover,
    .sidebar-icon.active{
      background:rgba(255,255,255,.16);
      color:#fff;
    }

    /* ================= MAIN ================= */

    .main-content{
      flex:1;
      margin-left:70px;
      width:calc(100% - 70px);
    }

    .header{
      background:linear-gradient(135deg,#4A89C8 0%,#2E75B6 100%);
      padding:60px 40px;
      min-height:240px;
      text-align:center;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .header h1{
      color:#fff;
      font-size:42px;
      font-weight:800;
      margin-bottom:14px;
    }

    .header p{
      color:rgba(255,255,255,.92);
      font-size:18px;
      max-width:700px;
      line-height:1.7;
    }

    .wrap{
      padding:16px;
    }

    .topbar{
      background:#fff;
      border-radius:18px;
      padding:14px 18px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;

      box-shadow:0 4px 16px rgba(46,58,89,.06);

      margin-bottom:14px;
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .pill{
      display:flex;
      align-items:center;
      gap:8px;

      background:#EAF3FF;
      color:#2F80ED;

      padding:10px 14px;
      border-radius:999px;

      font-size:13px;
      font-weight:800;
    }

    .meta{
      font-size:13px;
      color:#6B7A90;
      font-weight:700;
    }

    .btn-back{
      background:#2F80ED;
      color:#fff;
      text-decoration:none;

      padding:12px 18px;
      border-radius:14px;

      display:flex;
      align-items:center;
      gap:10px;

      font-weight:800;
      transition:.2s;
    }

    .btn-back:hover{
      transform:translateY(-1px);
    }

    /* ================= LAYOUT ================= */

    .stage{
      display:grid;
      grid-template-columns:1fr 400px;
      gap:16px;
      align-items:start;
    }

    @media(max-width:1200px){
      .stage{
        grid-template-columns:1fr;
      }
    }

    /* ================= LEFT ================= */

    .slide{
      background:#fff;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(46,58,89,.08);
    }

    .slide-head{
      padding:22px;
      border-bottom:1px solid #EEF3F8;

      display:flex;
      gap:16px;
      align-items:flex-start;
    }

    .badge{
      width:58px;
      height:58px;

      border-radius:18px;

      background:#2F80ED;
      color:#fff;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:24px;
      font-weight:900;

      flex:0 0 auto;
    }

    .head-text{
      flex:1;
    }

    .title{
      font-size:34px;
      line-height:1.15;
      font-weight:900;
      color:#1F2D3D;
    }

    .short{
      margin-top:8px;

      font-size:18px;
      color:#6B7A90;
      font-weight:600;
    }

    .slide-body{
      padding:22px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    /* ================= FLOW ================= */

    .process-flow-section{
      background:#F8FBFF;
      border:1px solid #E5EDF5;
      border-radius:22px;
      padding:20px;
    }

    .side-section-title{
      display:flex;
      align-items:center;
      gap:10px;

      color:#234A74;
      font-weight:900;
      font-size:18px;
    }

    .flow-top-wrap{
      margin-top:18px;

      display:flex;
      align-items:center;
      gap:10px;

      overflow-x:auto;
      padding-bottom:10px;
    }

    .flow-top-wrap::-webkit-scrollbar{
      height:8px;
    }

    .flow-top-wrap::-webkit-scrollbar-thumb{
      background:#D6E3F2;
      border-radius:999px;
    }

    .flow-start,
    .flow-end{
      min-width:110px;
      height:62px;

      border-radius:18px;

      border:2px solid #2F80ED;
      background:#fff;
      color:#2F80ED;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:14px;
      font-weight:900;

      flex:0 0 auto;
    }

    .flow-arrow-inline{
      color:#7B8BA1;
      font-size:18px;
      flex:0 0 auto;
    }

    .flow-step{
      min-width:180px;
      min-height:95px;

      border:2px solid #E5EDF5;
      background:#fff;

      border-radius:16px;

      padding:12px 10px;

      text-align:center;

      cursor:pointer;

      flex:0 0 auto;

      transition:.2s;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .flow-step:hover{
      transform:translateY(-2px);
    }

    .flow-step-no{
      width:34px;
      height:34px;

      border-radius:50%;

      background:#EAF3FF;
      color:#2F80ED;

      display:flex;
      align-items:center;
      justify-content:center;

      margin:0 auto 8px;

      font-weight:900;
      font-size:14px;
    }

    .flow-step-short{
      font-size:15px;
      font-weight:900;
      color:#1F2D3D;
      line-height:1.35;
      text-align:center;
    }

    .flow-step.completed{
      background:#F0FDF4;
      border-color:#22C55E;
    }

    .flow-step.completed .flow-step-no{
      background:#22C55E;
      color:#fff;
    }

    .flow-step.active{
      background:#EFF6FF;
      border-color:#2F80ED;
      box-shadow:0 0 0 4px rgba(47,128,237,.12);
    }

    .flow-step.active .flow-step-no{
      background:#2F80ED;
      color:#fff;
    }

    /* ================= DETAIL ================= */

    .detail{
      background:#fff;
      border-radius:18px;

      padding:18px;

      font-size:16px;
      line-height:1.8;

      white-space:pre-line;
    }

    /* ================= WI BUTTON ================= */

    .btn-wi{
      display:inline-flex;
      align-items:center;
      gap:10px;

      background:#2F80ED;
      color:#fff;
      text-decoration:none;

      padding:14px 18px;
      border-radius:16px;

      width:fit-content;

      font-weight:900;
    }

    .btn-wi.disabled{
      background:#C9D6E3;
      color:#5B6B7A;
      pointer-events:none;
    }

    /* ================= HAZARD FRAME ================= */

    .hazard-frame{
      --b:8px;
      --r:22px;
      --pad:0px;

      position:relative;
      border-radius:var(--r);

      padding:calc(var(--b) + var(--pad));

      overflow:hidden;
      background:transparent;

      box-shadow:0 4px 12px rgba(46,58,89,.10);
    }

    .hazard-frame::before{
      content:"";
      position:absolute;
      inset:0;

      border-radius:var(--r);

      background:repeating-linear-gradient(
        45deg,
        var(--c1) 0 14px,
        var(--c2) 14px 28px
      );

      z-index:0;
    }

    .hazard-frame::after{
      content:"";
      position:absolute;

      inset:var(--b);

      border-radius:calc(var(--r) - var(--b));

      background:var(--inner);

      z-index:1;
    }

    .hazard-red{
      --c1:#111;
      --c2:#E53935;
      --inner:#FFF1F1;
    }

    .hazard-yellow{
      --c1:#111;
      --c2:#FFD600;
      --inner:#FFFBEA;
    }

    .critical,
    .impact{
      position:relative;
      z-index:2;

      padding:18px;

      display:flex;
      gap:10px;
      align-items:flex-start;

      font-size:14px;
      font-weight:800;
      line-height:1.6;

      background:transparent;
    }

    .critical{
      color:#C62828;
      white-space:pre-line;
    }

    .impact{
      color:#8A5A00;
    }

    .critical i,
    .impact i{
      margin-top:3px;
      flex:0 0 auto;
    }

    .impact-text{
      flex:1;
    }

    .impact-title{
      font-weight:900;
      margin-bottom:6px;
    }

    .impact-subtitle{
      font-weight:900;
      margin-top:10px;
      margin-bottom:6px;
    }

    .impact-line,
    .impact-list{
      white-space:pre-line;
      line-height:1.55;
    }

    /* ================= RIGHT ================= */

    .panel{
      background:#fff;
      border-radius:24px;
      padding:20px;

      box-shadow:0 8px 24px rgba(46,58,89,.08);

      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .progress{
      background:#F5F9FF;
      border:1px solid #E2ECF8;

      border-radius:18px;

      padding:16px;
    }

    .progress-top{
      display:flex;
      justify-content:space-between;

      font-weight:900;
      color:#234A74;
    }

    .bar{
      margin-top:12px;

      height:12px;

      border-radius:999px;

      background:#DCE8F6;
      overflow:hidden;
    }

    .bar > div{
      height:100%;
      background:#2F80ED;
      border-radius:999px;
      transition:.25s;
    }

    .nav-btns{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .btn{
      border:none;

      padding:14px;
      border-radius:16px;

      font-family:'Sarabun',sans-serif;
      font-weight:900;
      font-size:16px;

      cursor:pointer;
      transition:.2s;
    }

    .btn-prev{
      background:#EEF3F8;
      color:#2E3A59;
    }

    .btn-next{
      background:#2F80ED;
      color:#fff;
    }

    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .mini-list{
      border:1px solid #E9F0F8;
      border-radius:18px;
      overflow:hidden;
    }

    .mini-item{
      padding:14px;

      display:flex;
      gap:12px;
      align-items:flex-start;

      border-bottom:1px solid #EEF3F8;

      cursor:pointer;
      transition:.2s;
    }

    .mini-item:last-child{
      border-bottom:none;
    }

    .mini-no{
      width:34px;
      height:34px;

      border-radius:12px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#EAF3FF;
      color:#2F80ED;

      font-size:13px;
      font-weight:900;

      flex:0 0 auto;
    }

    .mini-t{
      font-size:15px;
      font-weight:900;
      color:#1F2D3D;
      line-height:1.4;
    }

    .mini-s{
      margin-top:4px;

      font-size:13px;
      line-height:1.45;

      color:#6B7A90;
    }

    .mini-item.completed{
      background:#F0FDF4;
      border-left:6px solid #22C55E;
    }

    .mini-item.completed .mini-no{
      background:#22C55E;
      color:#fff;
    }

    .mini-item.active{
      background:#EFF6FF;
      border-left:6px solid #2F80ED;
    }

    .mini-item.active .mini-no{
      background:#2F80ED;
      color:#fff;
    }

    @media (max-width:768px){

      .sidebar{
        width:100%;
        height:60px;

        flex-direction:row;
        justify-content:center;

        position:relative;
      }

      .main-content{
        margin-left:0;
        width:100%;
      }

      .header{
        padding:40px 20px;
        min-height:180px;
      }

      .header h1{
        font-size:30px;
      }

      .wrap{
        padding:12px;
      }
    }

  </style>
</head>

<body>

</body>
</html>
